<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopify HQ Internal - View Only</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .viewer-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* The iframe displaying the Notion page */
        .notion-frame {
            width: 100%;
            height: 100%;
            border: none;
            pointer-events: none; /* Disable all mouse interactions on the iframe */
        }

        /* Invisible overlay to block all clicks and interactions */
        .interaction-blocker {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1000;
            cursor: default;
            /* Transparent but catches all events */
            background: transparent;
        }

        /* Optional: subtle indicator that this is view-only */
        .view-only-badge {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 1001;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 16px;
            border-radius: 4px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 12px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="viewer-container">
        <!-- Invisible overlay that blocks all interactions -->
        <div class="interaction-blocker"></div>

        <!-- The Notion page embedded in an iframe -->
        <iframe
            class="notion-frame"
            src="https://wiggly-fir-b9a.notion.site/Shopify-HQ-Internal-2a913c836ea680dba839c76eee32d4dc"
            title="Shopify HQ Internal - View Only"
            loading="lazy"
        ></iframe>

        <!-- View-only indicator badge -->
        <div class="view-only-badge">View Only</div>
    </div>

    <script>
        // Prevent keyboard shortcuts that might interact with the iframe
        document.addEventListener('keydown', function(e) {
            // Block common interactive shortcuts
            if (e.ctrlKey || e.metaKey) {
                // Allow refresh (F5, Ctrl+R) and close (Ctrl+W) but block others
                if (!['r', 'w', 'F5'].includes(e.key)) {
                    e.preventDefault();
                }
            }
        });

        // Prevent right-click context menu
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        // Prevent drag operations
        document.addEventListener('dragstart', function(e) {
            e.preventDefault();
        });
    </script>
</body>
</html>
